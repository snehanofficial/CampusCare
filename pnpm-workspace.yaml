packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - nodemailer@10.0.16
overrides:
  brace-expansion@<=5.0.11: ^5.0.12
  proxy-addr: ">=2.0.8"
  fast-uri@>=3.0.0 <3.1.7: ^3.1.8
  source-map-js: ^1.2.2
  compression: ^1.8.2
  nodemailer: ^10.0.16
  multer: ^2.4.0
  engine.io: ^6.6.11
  nanoid@<3.3.18: ^3.3.20
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  deepmerge-ts: ^8.0.2
  mysql2: ^3.24.5
  xlsx: "https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz"
