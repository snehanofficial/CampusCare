<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusCare - Campus Help Desk & ITSM Portal</title>
    
    <!-- PWA Meta tags -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CampusCare" />
    <meta name="theme-color" content="#3b82f6" />

    <!-- FOUC (Flash of Unstyled Content) Prevention Script -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("campuscare-theme");
          var theme = "light";
          if (stored === "dark") {
            theme = "dark";
          } else if (stored === "light") {
            theme = "light";
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
          document.documentElement.classList.add(theme);
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
